[package]
name = "dpml"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "main"
path = "src/bin/main.rs"

[profile.release]
debug = true 

[dependencies]
clap = {version = "4.5.50", features = ["derive"]}

[dev-dependencies]
datatest-stable = "0.3"
criterion = "0.5"

[[test]]
name = "required_tests"
harness = false


[[bench]]
name = "bench"
harness = false
