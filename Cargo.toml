[package]
name = "dpml"
version = "0.1.0"
edition = "2024"
default-run = "main"

[[bin]]
name = "main"
path = "src/bin/main.rs"

[[bin]]
name = "plot"
path = "src/bin/plot.rs"

[profile.release]
debug = false

[dependencies]
clap = {version = "4.5.50", features = ["derive"]}
nom = "8.0.0"
roaring = "0.11.3"
rayon = "1.11.0"
cpu-time = "1.0.0"
walkdir = "2.5"
gnuplot = "0.0.46"
itertools = "0.14.0"

[dev-dependencies]
datatest-stable = "0.3"
criterion = "0.5"

[[test]]
name = "required_tests"
harness = false

[[test]]
name = "all_provided_inputs"
harness = false

[[bench]]
name = "bench"
harness = false
