[package]
name = "dpml"
version = "0.1.0"
edition = "2024"
default-run = "main"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "main"
path = "src/bin/main.rs"
required-features = ["cli"]

[features]
default = ["cli"]
# Native command line solver (not available on wasm).
cli = ["dep:tikv-jemallocator", "dep:clap", "dep:cpu-time", "dep:gnuplot", "dep:walkdir", "dep:rayon"]
# Browser bindings, build with: wasm-pack build web --release --target web --no-default-features --features wasm
wasm = ["dep:wasm-bindgen", "dep:serde-wasm-bindgen", "dep:console_error_panic_hook"]

[profile.release]
debug = true
codegen-units = 1
lto = "fat"

[dependencies]
tikv-jemallocator = { version = "0.6.1", optional = true }
clap = { version = "4.5.50", features = ["derive"], optional = true }
cpu-time = { version = "1.0.0", optional = true }
walkdir = { version = "2.5", optional = true }
gnuplot = { version = "0.0.46", optional = true }
rayon = { version = "1.11.0", optional = true }
wasm-bindgen = { version = "0.2", optional = true }
serde-wasm-bindgen = { version = "0.6", optional = true }
console_error_panic_hook = { version = "0.1", optional = true }
nom = "8.0.0"
roaring = "0.11.3"
itertools = "0.14.0"
serde = {version = "1.0.228", features = ["derive"]}
serde_json = "1.0.149"
smallvec = "1.15.1"
priority-queue = "2.7.0"
rustc-hash = "2.1.1"

[dev-dependencies]
datatest-stable = "0.3"
criterion = "0.5"

[[test]]
name = "all_provided_inputs"
harness = false
